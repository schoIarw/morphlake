database:
  backend: postgresql
  host: postgresql.example.internal
  port: 5432
  name: morphlake
  auth:
    mode: encrypt
    username: ENC[replace-with-script-output]
    password: ENC[replace-with-script-output]
    key_env: MORPHLAKE_DB_CREDENTIAL_KEY
  auto_create_database: true
  maintenance_database: postgres
  ssl_mode: prefer
  connect_timeout_seconds: 10
  pool_size: 20
  max_overflow: 40
  pool_recycle_seconds: 1800
