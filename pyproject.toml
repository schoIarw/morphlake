[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "morphlake"
version = "0.1.0"
description = "A simple Paimon 2.0 multimodal foundation on MinIO"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = {text = "Apache-2.0"}
authors = [{name = "MorphLake contributors"}]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.6,<3",
  "python-multipart>=0.0.18,<1",
  "minio>=7.2,<8",
  "pypaimon[full-text,vindex]==2.0.0",
  "pyarrow>=16,<20",
  "httpx>=0.27,<1",
  "PyYAML>=6,<7",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
]

[project.scripts]
morphlake = "morphlake.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/morphlake"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
